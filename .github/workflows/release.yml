name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build all targets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for t in "linux:amd64:z1pfd-linux-amd64" "linux:arm64:z1pfd-linux-arm64" "windows:amd64:z1pfd-windows-amd64.exe" "darwin:amd64:z1pfd-macos-amd64" "darwin:arm64:z1pfd-macos-arm64"; do
            GOOS="${t%%:*}"
            rest="${t#*:}"
            GOARCH="${rest%%:*}"
            OUT="dist/${rest#*:}"
            echo "→ building $OUT (GOOS=$GOOS GOARCH=$GOARCH)"
            GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 go build \
              -ldflags "-s -w -X main.version=${VERSION}" -o "$OUT" .
          done

      - name: Package (.zip + checksums)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          for f in z1pfd-*; do
            bin="z1pfd"
            case "$f" in *.exe) bin="z1pfd.exe" ;; esac
            base="${f%.*}"
            mkdir -p "pkg/$base"
            cp "$f" "pkg/$base/$bin"
            (cd "pkg/$base" && zip -q -9 "../../z1pfd-v${VERSION}-${base#z1pfd-}.zip" "$bin")
          done
          sha256sum *.zip > checksums.txt
          ls -la

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
