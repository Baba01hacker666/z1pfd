name: build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Cross-compile smoke test
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o /dev/null .
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o /dev/null .
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o /dev/null .
